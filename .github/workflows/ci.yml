name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5 # TODO: pin 40-hex SHA once the repo is public
      - run: node scripts/verify-workflow-action-pins.mjs
      - uses: actions/setup-node@v5 # TODO: pin 40-hex SHA once the repo is public
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run verify:package
