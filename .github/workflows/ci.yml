name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    name: typecheck + tests + build + package verify (Node 24)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
        env:
          npm_config_cache: "${{ runner.temp }}/npm-cache"

      - name: Install dependencies
        # --legacy-peer-deps: the dsh devDep matrix spans version lines whose
        # peer ranges conflict (e.g. dsh-client-runtime 0.1.1 vs dsh-agent
        # 0.1.2); at runtime those peers resolve from the dsh install, so the
        # dev-tree install deliberately relaxes peer resolution.
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Typecheck (src + tests)
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm test

      - name: Full build
        run: npm run build

      - name: Verify packed artifact + consumer types + determinism
        run: npm run verify:package

      - name: Upload packed tarball
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mcp-scope-${{ matrix.node }}-${{ github.sha }}
          path: .smoke/verify/dist/*.tgz
        if: always()

  # Optional live smoke against a real dsh instance (manual dispatch only).
  # Requires a SELF-HOSTED runner tagged `dsh-smoke` that has the
  # chamber-anchored dsh 0.1.2-rc.1 CLI at /root/.dsh-chamber/gateway/
  # dsh-anchor (see scripts/smoke + docs/milestones + docs/RELEASE.md §smoke).
  smoke:
    name: live smoke (self-hosted, manual)
    runs-on: [self-hosted, dsh-smoke]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
        env:
          npm_config_cache: "${{ runner.temp }}/npm-cache"
      - name: Install dependencies
        # --legacy-peer-deps: the dsh devDep matrix spans version lines whose
        # peer ranges conflict (e.g. dsh-client-runtime 0.1.1 vs dsh-agent
        # 0.1.2); at runtime those peers resolve from the dsh install, so the
        # dev-tree install deliberately relaxes peer resolution.
        run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Build & pack
        run: npm run build && npm run pack:tgz
      - name: Run M0/M1 live smoke
        run: npm run test:smoke
