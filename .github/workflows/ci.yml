name: CI

# Validation chain. Chamber norm: push main + tags v* + PR all run the SAME
# chain — a tag can never publish an untested commit, and release.yml keeps
# its own release-local gate because tag-triggered workflows run in parallel.
# workflow_dispatch additionally arms the self-hosted live-smoke lane.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: typecheck + tests + build + package verify (Node 24)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24']
    steps:
      - uses: actions/checkout@v5 # TODO: pin 40-hex SHA once the repo is public

      - name: Verify workflow action pins & release structure
        run: node scripts/verify-workflow-action-pins.mjs

      - name: Setup Node ${{ matrix.node }}
        # NOTE: do NOT add a job-level npm_config_cache env — job-level env
        # cannot reference the `runner` context ("context runner is not
        # allowed here"), which fails the whole workflow at job creation
        # ("No jobs were run", zero-job runs, no logs). setup-node's npm
        # cache already caches the default ~/.npm cache dir, so no override
        # is needed.
        uses: actions/setup-node@v5 # TODO: pin 40-hex SHA once the repo is public
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        # No --legacy-peer-deps: after the 0.1.5 migration every @deepseek-ai
        # devDep is pinned to the SAME generation (0.1.5-rc.2, the one a
        # `dsh@0.1.5-rc.1` install actually resolves to), so the peer graph is
        # internally consistent and npm resolves it unaided. Pinning the
        # umbrella's rc.1 while upstream's own rc.1 peers pull rc.2 artifacts
        # is what used to force the relaxed resolution. A future pin that
        # reopens the conflict will fail here loudly — fix the pins, not the
        # flag.
        run: npm ci --no-audit --no-fund

      # npm ci is inherently frozen (errors on package.json/lockfile drift and
      # never writes the lockfile); this assert makes the invariant visible
      # and catches any future step that slips to bare `npm install`.
      - name: Assert lockfile not rewritten
        run: git diff --exit-code -- package-lock.json

      - name: Typecheck (src + tests)
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm test

      - name: Full build
        run: npm run build

      - name: Verify packed artifact + consumer types + determinism
        run: npm run verify:package

      - name: Upload packed tarball
        uses: actions/upload-artifact@v6 # TODO: pin 40-hex SHA once the repo is public
        with:
          name: dsh-chamber-mcp-${{ matrix.node }}-${{ github.sha }}
          path: .smoke/verify/dist/*.tgz
          if-no-files-found: error
        if: always()

  # Optional live smoke against a real dsh instance (manual dispatch only).
  # Requires a SELF-HOSTED runner tagged `dsh-smoke` that has the
  # chamber-anchored dsh CLI (see docs/RELEASE.md §smoke); label registered
  # in .github/actionlint.yaml for local linting.
  smoke:
    name: live smoke (self-hosted, manual)
    runs-on: [self-hosted, dsh-smoke]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5 # TODO: pin 40-hex SHA once the repo is public

      - name: Setup Node 24
        uses: actions/setup-node@v5 # TODO: pin 40-hex SHA once the repo is public
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build & pack
        run: npm run build && mkdir -p .smoke && npm run pack:tgz

      - name: Run M0/M1 live smoke
        run: npm run test:smoke
