name: Release

# Tag-driven GitHub Release (tgz asset only).
#
# ⚠ npm publishing is TEMPORARILY DISABLED — releases currently ship the
# packed `dsh-mcp-scope-<version>.tgz` as the GitHub Release asset; users
# install it directly, e.g.:
#   dsh plugin --profile web add \
#     https://github.com/<owner>/dsh-mcp-scope/releases/download/v0.2.0/dsh-mcp-scope-0.2.0.tgz
#
# To re-enable npm publishing later: uncomment the "Publish to npm" step
# below, add the repository secret NPM_TOKEN, and restore `id-token: write`
# in `permissions` when using `--provenance`.
#
# Flow:
#   1. move CHANGELOG notes from "[Unreleased]" into a dated section and bump
#      package.json#version (commit);
#   2. tag the commit:      git tag v0.2.0
#   3. push tag:            git push origin v0.2.0
#   → full gate → release notes from CHANGELOG → GitHub Release + tgz asset.

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release + attach the tgz asset

jobs:
  release:
    name: Gate, pack, GitHub Release (tgz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # --legacy-peer-deps: the dsh devDep matrix spans version lines whose
        # peer ranges conflict (e.g. dsh-client-runtime 0.1.1 vs dsh-agent
        # 0.1.2); at runtime those peers resolve from the dsh install, so the
        # dev-tree install deliberately relaxes peer resolution.
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Full gate (typecheck + tests + build + package verify)
        run: npm run check

      - name: Tag/version sanity
        run: |
          pkg_ver=$(node -p "require('./package.json').version")
          tag_ver="${GITHUB_REF_NAME#v}"
          test "$pkg_ver" = "$tag_ver" || {
            echo "::error::package.json version $pkg_ver does not match tag v$tag_ver"
            exit 1
          }
          echo "Releasing dsh-mcp-scope@$pkg_ver"
          echo "PKG_VERSION=$pkg_ver" >> "$GITHUB_ENV"

      - name: Compose release notes from CHANGELOG
        run: node scripts/release-notes.mjs "$PKG_VERSION" --out .smoke/release-notes.md

      # ------------------------------------------------------------------
      # Temporarily disabled — npm publish. Re-enable when ready:
      #
      # - name: Publish to npm
      #   run: npm publish --provenance
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # ------------------------------------------------------------------

      - name: Create GitHub Release with tgz asset
        uses: softprops/action-gh-release@v3
        with:
          name: dsh-mcp-scope v${{ env.PKG_VERSION }}
          body_path: .smoke/release-notes.md
          files: .smoke/verify/dist/*.tgz
          fail_on_unmatched_files: true

      - name: Attach packed tarball artifact
        uses: actions/upload-artifact@v6
        with:
          name: dsh-mcp-scope-tgz
          path: .smoke/verify/dist/*.tgz
